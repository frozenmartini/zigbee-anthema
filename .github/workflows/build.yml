name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [bulb, coord, sniff]
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.path }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c6
          path: ${{ matrix.path }}

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host harness
        run: |
          cd tests
          ./run.sh --all
      - name: Tool tests
        run: |
          cd tests
          python3 test_ota_push.py
          python3 test_cfg_push.py
