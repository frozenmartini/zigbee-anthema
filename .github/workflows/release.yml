name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match the firmware version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ver="${REF_NAME#v}"
          src=$(sed -n 's/^set(PROJECT_VER "\(.*\)")$/\1/p' bulb/CMakeLists.txt)
          if [ -z "$src" ]; then
            echo "Could not read PROJECT_VER from bulb/CMakeLists.txt" >&2
            exit 1
          fi
          if [ "$ver" != "$src" ]; then
            echo "Tag $REF_NAME does not match PROJECT_VER $src in bulb/CMakeLists.txt" >&2
            exit 1
          fi
          if [ ! -f "docs/releases/v$ver.md" ]; then
            echo "docs/releases/v$ver.md is missing: write the release notes before the tag" >&2
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Build bulb
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c6
          path: bulb

      - uses: actions/setup-python@v6   # the runner's own Python refuses a system-wide pip install (PEP 668)
        with:
          python-version: '3.12'

      - name: Assemble the release files
        run: |
          python3 -m pip install "esptool>=4.8,<5"
          (cd bulb/build && esptool.py --chip esp32c6 merge_bin -o "../../zigbee-anthema-$VER-factory.bin" @flash_args)
          cp bulb/build/c6_bulb.bin "zigbee-anthema-$VER.bin"
          sha256sum "zigbee-anthema-$VER.bin" "zigbee-anthema-$VER-factory.bin" > SHA256SUMS
          sed "s/<ver>/$VER/g" site/manifest.template.json > manifest.json
          cat SHA256SUMS
          python3 -m json.tool manifest.json > /dev/null

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" --draft --verify-tag --title "$REF_NAME" \
            --notes-file "docs/releases/v$VER.md" \
            "zigbee-anthema-$VER.bin" \
            "zigbee-anthema-$VER-factory.bin" \
            SHA256SUMS \
            manifest.json
